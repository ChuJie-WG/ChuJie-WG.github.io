name: Deploy Hexo site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - BUILD_LOG.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install and build with diagnostic log
        shell: bash
        run: |
          set +e
          {
            echo "=== Node ==="
            node -v
            npm -v
            echo "=== npm install ==="
            npm install
            install_status=$?
            echo "npm install exit code: $install_status"
            if [ $install_status -ne 0 ]; then
              exit $install_status
            fi
            echo "=== Hexo build ==="
            npx hexo clean
            npx hexo generate
          } 2>&1 | tee BUILD_LOG.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add BUILD_LOG.txt
            git commit -m "Record Hexo build failure log [skip ci]" || true
            git push || true
            exit $status
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

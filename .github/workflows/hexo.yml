name: Deploy Hexo site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - BUILD_LOG.txt
      - BUILD_STATUS.txt
      - DEPLOY_STATUS.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Install and build with diagnostics
        id: hexo_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > BUILD_LOG.txt
          echo "setup_pages=${{ steps.pages.outcome }}" > BUILD_STATUS.txt
          {
            echo "=== Node ==="
            node -v
            npm -v
            echo "=== npm install ==="
            npm install
            install_status=$?
            echo "npm_install_exit_code=$install_status" >> BUILD_STATUS.txt
            if [ $install_status -ne 0 ]; then
              echo "hexo_clean=skipped" >> BUILD_STATUS.txt
              echo "hexo_generate=skipped" >> BUILD_STATUS.txt
              exit $install_status
            fi

            echo "=== Hexo build ==="
            npx hexo clean
            clean_status=$?
            echo "hexo_clean_exit_code=$clean_status" >> BUILD_STATUS.txt
            if [ $clean_status -ne 0 ]; then
              echo "hexo_generate=skipped" >> BUILD_STATUS.txt
              exit $clean_status
            fi

            npx hexo generate
            generate_status=$?
            echo "hexo_generate_exit_code=$generate_status" >> BUILD_STATUS.txt
            exit $generate_status
          } 2>&1 | tee BUILD_LOG.txt
          exit ${PIPESTATUS[0]}

      - name: Upload Pages artifact
        id: upload
        if: steps.pages.outcome == 'success' && steps.hexo_build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Record build diagnostics
        if: always()
        shell: bash
        run: |
          echo "build_step=${{ steps.hexo_build.outcome }}" >> BUILD_STATUS.txt
          echo "upload_pages_artifact=${{ steps.upload.outcome }}" >> BUILD_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.txt
          if [ "${{ steps.pages.outcome }}" != "success" ] || [ "${{ steps.hexo_build.outcome }}" != "success" ] || [ "${{ steps.upload.outcome }}" != "success" ]; then
            git add BUILD_LOG.txt
          fi
          git commit -m "Record Pages build diagnostics [skip ci]" || true
          git push || true

      - name: Stop on build failure
        if: steps.pages.outcome != 'success' || steps.hexo_build.outcome != 'success' || steps.upload.outcome != 'success'
        run: exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record deploy status
        if: always()
        shell: bash
        run: |
          echo "deploy_step=${{ steps.deployment.outcome }}" > DEPLOY_STATUS.txt
          echo "page_url=${{ steps.deployment.outputs.page_url }}" >> DEPLOY_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add DEPLOY_STATUS.txt
          git commit -m "Record Pages deploy status [skip ci]" || true
          git push || true

      - name: Stop on deploy failure
        if: steps.deployment.outcome != 'success'
        run: exit 1

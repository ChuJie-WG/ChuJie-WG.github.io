  <title>ChuJie Notes · 后台管理</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f5f6f8; }
    .admin-note {

      z-index: 99999;
      right: 16px;
      bottom: 16px;
      max-width: 320px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(20, 20, 22, .94);
      color: #fff;
      font: 12px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .16);
    }
    .admin-note strong { display:block; margin-bottom: 2px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="admin-note">

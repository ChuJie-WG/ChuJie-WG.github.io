# =========================================================
# Hexo site config
# =========================================================
title: ChuJie Notes
subtitle: 'Hardware · Embedded · Engineering Notes'
description: '个人技术学习与工程实践笔记'
keywords: hardware, embedded, linux, ddr, ethernet, notes
author: ChuJie-WG
language: zh-CN
timezone: Asia/Shanghai

url: https://ChuJie-WG.github.io
root: /
permalink: post/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date

per_page: 10
pagination_dir: page

abbrlink:
  alg: crc32
  rep: hex

search:
  path: search.xml
  field: post
  content: true
  format: html

theme: next

tag_generator:
  enable_index_page: false
